<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js"></script>
  <title>Album Eveniment</title>
</head>
<body>
  <div class="page">

    <header class="page-header">
      <h1>Album Eveniment</h1>
      <p class="subtitle">Adaugă o amintire de la eveniment</p>
    </header>

    <div class="media-frame">
      <!-- Live camera feed -->
      <video id="viewfinder" autoplay playsinline muted></video>

      <!-- Preview after capture -->
      <img id="preview" alt="previzualizare">
      <video id="previewVideo" controls></video>
    </div>

    <div class="controls">
      <button class="btn btn-outline" id="btnFlip" onclick="flipCamera()">Schimbă camera</button>

      <div class="capture-row">
        <button class="btn btn-primary" id="btnCapture" onclick="takePhoto()">Fotografie</button>
        <button class="btn btn-accent" id="btnRecord" onclick="toggleVideo()">Video</button>
      </div>

      <button class="btn btn-send" id="btnSend" onclick="sendFile()">Trimite</button>
    </div>

    <p id="message"></p>

    <section class="gallery-section" aria-labelledby="galleryTitle">
      <div class="gallery-header">
        <div>
          <h2 id="galleryTitle">Galerie</h2>
          <p class="gallery-subtitle">Amintirile încărcate la acest eveniment</p>
        </div>
      </div>

      <div id="galleryGrid" class="gallery-grid"></div>

      <p id="galleryEmpty" class="gallery-empty">Nu există încă fotografii sau videoclipuri.</p>
      <p id="galleryMessage" class="gallery-message"></p>

      <button class="btn btn-outline gallery-load-more" id="btnLoadMore" type="button" onclick="loadMoreGallery()">
        Încarcă mai multe
      </button>
    </section>

  </div>

  <div id="galleryModal" class="gallery-modal" aria-hidden="true">
    <button class="gallery-modal-close" type="button" aria-label="Închide" onclick="closeGalleryModal()">×</button>

    <div class="gallery-modal-content" onclick="event.stopPropagation()">
      <img id="galleryModalImage" alt="Fotografie din galerie">
      <video id="galleryModalVideo" controls playsinline></video>
    </div>
  </div>
</body>
</html>
