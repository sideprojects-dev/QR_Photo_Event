<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1,
    h2 {
      color: #333;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2d6a4f;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1b4332;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .event-card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 12px;
    }

    .event-url {
      color: #2d6a4f;
      font-size: 14px;
      word-break: break-all;
    }

    .status-active {
      color: #2d6a4f;
      font-size: 12px;
    }

    .status-archived {
      color: #999;
      font-size: 12px;
    }

    .small-btn {
      width: auto;
      padding: 8px 16px;
      margin-top: 8px;
      margin-right: 6px;
      font-size: 14px;
    }

    .back-btn {
      width: auto;
      margin-bottom: 20px;
      padding: 8px 16px;
      background: #555;
    }

    .back-btn:hover {
      background: #333;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 12px;
      border-radius: 4px;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    #loginSection {
      display: block;
    }

    #adminSection {
      display: none;
    }

    #locationDashboard {
      display: none;
    }
  </style>
</head>

<body>
  <!-- Login -->
  <div id="loginSection">
    <div class="card">
      <h1>🔐 Admin</h1>

      <input
        type="password"
        id="password"
        placeholder="Parola admin"
      >

      <button onclick="login()">Intră</button>

      <div
        id="loginError"
        style="color: red; margin-top: 8px; display: none;"
      >
        Parolă greșită
      </div>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminSection">

    <!-- Locations dashboard -->
    <div id="locationsDashboard">
      <div class="card">
        <h2>➕ Locație nouă</h2>

        <input
          type="text"
          id="locationName"
          placeholder="ex: Restaurant Bellaria"
        >

        <button
          id="createLocationBtn"
          onclick="createLocation()"
        >
          Creează locație
        </button>

        <div
          id="locationMessage"
          class="message"
        ></div>
      </div>

      <div class="card">
        <h2>📍 Locații</h2>
        <div id="locationsList">Se încarcă...</div>
      </div>
    </div>

    <!-- Selected location dashboard -->
    <div id="locationDashboard">
      <button
        class="back-btn"
        onclick="backToLocations()"
      >
        ← Înapoi la locații
      </button>

      <div class="card">
        <h2 id="selectedLocationName"></h2>
        <p
          id="selectedLocationSlug"
          class="event-url"
        ></p>
      </div>

      <div class="card">
        <h2>➕ Eveniment nou</h2>

        <input
          type="text"
          id="eventName"
          placeholder="ex: Nunta Ana & Mihai"
        >

        <button
          id="createEventBtn"
          onclick="createNewEvent()"
        >
          Creează eveniment + QR
        </button>

        <div
          id="eventMessage"
          class="message"
        ></div>
      </div>

      <div class="card">
        <h2>📋 Evenimente</h2>
        <div id="eventsList">Se încarcă...</div>
      </div>
    </div>
  </div>

  <script>
    let adminPassword = ''
    let selectedLocationSlug = null
    let selectedLocationName = null

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;')
    }

    function login() {
      const pwd = document.getElementById('password').value

      if (!pwd) {
        return
      }

      adminPassword = pwd
      loadLocations()
    }

    document.getElementById('password').addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        login()
      }
    })

    async function loadLocations() {
      try {
        const response = await fetch('/api/locations', {
          headers: {
            'x-admin-password': adminPassword
          }
        })

        if (response.status === 401) {
          document.getElementById('loginError').style.display = 'block'
          adminPassword = ''
          return
        }

        if (!response.ok) {
          throw new Error('Nu s-au putut încărca locațiile.')
        }

        document.getElementById('loginError').style.display = 'none'
        document.getElementById('loginSection').style.display = 'none'
        document.getElementById('adminSection').style.display = 'block'

        const data = await response.json()
        renderLocations(data.locations)
      } catch (err) {
        alert('Eroare: ' + err.message)
      }
    }

    function renderLocations(locations) {
      const container = document.getElementById('locationsList')

      if (!locations.length) {
        container.innerHTML = '<p style="color: #888;">Nu există locații încă.</p>'
        return
      }

      container.innerHTML = locations.map(location => `
        <div class="event-card">
          <strong>${escapeHtml(location.name)}</strong>
          <br>

          <span class="event-url">${escapeHtml(location.slug)}</span>
          <br>

          <button
            class="small-btn manage-location-btn"
            data-slug="${escapeHtml(location.slug)}"
            data-name="${escapeHtml(location.name)}"
          >
            Gestionează
          </button>
        </div>
      `).join('')

      container.querySelectorAll('.manage-location-btn').forEach(button => {
        button.addEventListener('click', () => {
          openLocation(button.dataset.slug, button.dataset.name)
        })
      })
    }

    function openLocation(slug, name) {
      selectedLocationSlug = slug
      selectedLocationName = name

      document.getElementById('locationsDashboard').style.display = 'none'
      document.getElementById('locationDashboard').style.display = 'block'

      document.getElementById('selectedLocationName').textContent = name
      document.getElementById('selectedLocationSlug').textContent = slug

      document.getElementById('eventMessage').style.display = 'none'
      loadLocationEvents()
    }

    function backToLocations() {
      selectedLocationSlug = null
      selectedLocationName = null

      document.getElementById('locationDashboard').style.display = 'none'
      document.getElementById('locationsDashboard').style.display = 'block'

      loadLocations()
    }

    async function createLocation() {
      const name = document.getElementById('locationName').value.trim()

      if (!name) {
        return
      }

      const button = document.getElementById('createLocationBtn')
      const message = document.getElementById('locationMessage')

      button.disabled = true
      button.textContent = 'Se creează...'

      try {
        const response = await fetch(
          `/api/locations?location_name=${encodeURIComponent(name)}`,
          {
            method: 'POST',
            headers: {
              'x-admin-password': adminPassword
            }
          }
        )

        const data = await response.json()

        if (!response.ok) {
          throw new Error(data.detail || 'Nu s-a putut crea locația.')
        }

        message.className = 'message success'
        message.style.display = 'block'
        message.textContent = '✅ Locația a fost creată.'

        document.getElementById('locationName').value = ''

        await loadLocations()
      } catch (err) {
        message.className = 'message error'
        message.style.display = 'block'
        message.textContent = 'Eroare: ' + err.message
      } finally {
        button.disabled = false
        button.textContent = 'Creează locație'
      }
    }

    async function loadLocationEvents() {
      if (!selectedLocationSlug) {
        return
      }

      const container = document.getElementById('eventsList')
      container.textContent = 'Se încarcă...'

      try {
        const response = await fetch(
          `/api/locations/${encodeURIComponent(selectedLocationSlug)}/events`,
          {
            headers: {
              'x-admin-password': adminPassword
            }
          }
        )

        if (response.status === 401) {
          adminPassword = ''
          document.getElementById('adminSection').style.display = 'none'
          document.getElementById('loginSection').style.display = 'block'
          document.getElementById('loginError').style.display = 'block'
          return
        }

        const data = await response.json()

        if (!response.ok) {
          throw new Error(data.detail || 'Nu s-au putut încărca evenimentele.')
        }

        selectedLocationName = data.location.name
        document.getElementById('selectedLocationName').textContent = data.location.name
        document.getElementById('selectedLocationSlug').textContent = data.location.slug

        renderEvents(data.events)
      } catch (err) {
        container.innerHTML = `<p style="color: #721c24;">${escapeHtml(err.message)}</p>`
      }
    }

    function renderEvents(events) {
      const container = document.getElementById('eventsList')

      if (!events.length) {
        container.innerHTML = '<p style="color: #888;">Nu există evenimente încă.</p>'
        return
      }

      container.innerHTML = events.map(event => `
        <div class="event-card">
          <strong>${escapeHtml(event.name)}</strong>

          ${
            event.status === 'active'
              ? '<span class="status-active"> ● ACTIV</span>'
              : '<span class="status-archived"> ○ arhivat</span>'
          }

          <br>

          <span class="event-url">
            https://qr-photo-event.onrender.com/event/${escapeHtml(event.slug)}
          </span>

          <br>

          <button
            class="small-btn download-qr-btn"
            data-slug="${escapeHtml(event.slug)}"
          >
            ⬇️ Descarcă QR
          </button>

          ${
            event.status !== 'active'
              ? `
                <button
                  class="small-btn activate-event-btn"
                  data-slug="${escapeHtml(event.slug)}"
                >
                  ✅ Activează
                </button>
              `
              : ''
          }
        </div>
      `).join('')

      container.querySelectorAll('.download-qr-btn').forEach(button => {
        button.addEventListener('click', () => {
          downloadQR(button.dataset.slug)
        })
      })

      container.querySelectorAll('.activate-event-btn').forEach(button => {
        button.addEventListener('click', () => {
          activateEvent(button.dataset.slug)
        })
      })
    }

    async function createNewEvent() {
      const name = document.getElementById('eventName').value.trim()

      if (!name || !selectedLocationSlug) {
        return
      }

      const button = document.getElementById('createEventBtn')
      const message = document.getElementById('eventMessage')

      button.disabled = true
      button.textContent = 'Se creează...'
      message.style.display = 'none'

      try {
        const url =
          `/api/create-event?event_name=${encodeURIComponent(name)}` +
          `&location_slug=${encodeURIComponent(selectedLocationSlug)}`

        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'x-admin-password': adminPassword
          }
        })

        const data = await response.json()

        if (!response.ok) {
          throw new Error(data.detail || data.error || 'Nu s-a putut crea evenimentul.')
        }

        message.className = 'message success'
        message.style.display = 'block'
        message.textContent = '✅ Evenimentul a fost creat.'

        document.getElementById('eventName').value = ''

        await loadLocationEvents()

        //downloadQR(data.slug)
      } catch (err) {
        message.className = 'message error'
        message.style.display = 'block'
        message.textContent = 'Eroare: ' + err.message
      } finally {
        button.disabled = false
        button.textContent = 'Creează eveniment + QR'
      }
    }

    function downloadQR(slug) {
      window.open(`/api/qr/${encodeURIComponent(slug)}`, '_blank')
    }

    async function activateEvent(slug) {
      try {
        const response = await fetch(
          `/api/events/${encodeURIComponent(slug)}/activate`,
          {
            method: 'POST',
            headers: {
              'x-admin-password': adminPassword
            }
          }
        )

        const data = await response.json()

        if (!response.ok) {
          throw new Error(data.detail || 'Nu s-a putut activa evenimentul.')
        }

        await loadLocationEvents()
      } catch (err) {
        alert('Eroare: ' + err.message)
      }
    }
  </script>
</body>
</html>
